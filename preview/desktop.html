<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>零一·凌界 — 桌面布局预览</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px 'Helvetica Neue','PingFang SC',sans-serif;background:#000;color:#eee}button,textarea{font:inherit}button{color:inherit;cursor:pointer;background:transparent;border:0;padding:9px 12px}button:focus-visible{outline:2px solid currentColor}#root{height:100dvh}.fixture_frame{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr)}.fixture_frame.collapsed{grid-template-columns:0 minmax(0,1fr)}.fixture_sidebarCol{overflow:hidden}.fixture_root{height:100%;display:flex;flex-direction:column;padding:36px 14px 18px}.fixture_logoRow{display:flex;align-items:center}.fixture_brandIdentity{display:flex}.fixture_newSession{margin:0 0 14px;width:100%;flex:none}.fixture_panelList{display:flex;flex-direction:column}.fixture_panelRow{text-align:left;display:flex;align-items:center;gap:12px}.fixture_panelRow svg{width:18px;height:18px}.workspace-label{font-size:12px;color:var(--dsw-alias-label-tertiary);margin:12px 4px}.workspace-row{margin-top:10px;line-height:1.8;padding:8px}.session{padding:10px;margin-top:10px}.fixture_footArea{margin-top:auto;color:var(--dsw-alias-label-secondary);font-size:11px;display:flex;justify-content:space-between}.fixture_centerCol{position:relative;display:flex;flex-direction:column;min-width:0}[data-conversation-header]{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none;padding:0 20px;color:#999;font-size:11px}[data-conversation-region]{position:relative;flex:1;min-height:0}.composer-position{position:absolute;left:36px;right:36px;top:51%;display:flex;justify-content:center}.composer-group{width:100%;max-width:640px}.workspace-tools{display:flex;gap:16px;font-size:12px;color:#c4c4c4;margin-bottom:18px}[data-composer-card]{padding:18px;height:150px;display:flex;flex-direction:column}textarea{resize:none;background:transparent;border:0;color:#eee;flex:1;outline:none;line-height:1.7;width:100%}footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#aaa}.send{background:#ddd;color:#111!important;width:30px;height:30px;padding:0}.demo-hint{position:absolute;bottom:54px;left:0;right:0;text-align:center;color:#999;font-size:10px}dialog{padding:24px;width:min(420px,90vw)}dialog h2{margin-top:0}dialog::backdrop{background:#0009}dialog p{line-height:1.8;color:#bbb}.close{border:1px solid #555}a{color:inherit} @media(max-width:760px){.fixture_frame{grid-template-columns:0 minmax(0,1fr)}.composer-position{left:24px;right:24px}.demo-hint{font-size:9px}.header-label{display:none}}
</style></head><body data-ds-dark-theme>
<div id="root"><div class="fixture_frame">
<aside class="fixture_sidebarCol" data-slot="sidebar"><div class="fixture_root">
<div class="fixture_logoRow"><div class="fixture_brandIdentity"><span>零一 AI 日新社</span></div></div>
<button class="fixture_newSession" id="new">＋ 新会话</button>
<nav class="fixture_panelList" aria-label="演示导航"><button class="fixture_panelRow" id="about">◇ 关于凌界</button><button class="fixture_panelRow" id="replay">↗ 重播桌面入场</button><button class="fixture_panelRow" id="motion">Ⅱ 暂停动态</button></nav>
<div class="workspace-label">工作区</div><div class="workspace-row">⌑ 零一 AI 日新社</div><div class="session" role="row" aria-selected="true">新的想法</div>
<div class="fixture_footArea"><span>零一·凌界</span><span>主题预览</span></div>
</div></aside>
<section class="fixture_centerCol"><header data-conversation-header><button id="sidebar" aria-label="切换侧栏">☷</button><span class="header-label">本地布局预览 · 未连接 DSH</span><a href="/" style="text-decoration:none">纯壁纸 ↗</a></header>
<main data-conversation-region><div class="fixture_headline"><span class="fixture_titleGroup"></span></div><div class="composer-position"><div class="composer-group"><div class="workspace-tools"><span>⌑ 社团工作区</span><span>◇ 从想法开始</span></div><div data-composer-card><textarea aria-label="预览输入框" placeholder="今天，想从哪个想法开始？"></textarea><footer><span>＋　实践，让想法发生</span><button class="send" type="button" aria-label="演示按钮，不发送消息">↑</button></footer></div></div></div><div class="demo-hint">界面布局演示 · 不发送消息，不调用模型</div></main>
</section></div></div>
<dialog aria-modal="true" aria-hidden="true" role="dialog"><h2>零一·凌界</h2><p>零一 AI 日新社的黑白机械终端主题。这里使用与插件相同的壁纸和主题样式，演示桌面布局；不是已连接的 DSH 客户端。</p><button class="close">关闭</button></dialog>
<script>window.__ModuleLoader__={load(def){window.themePlugin=def.factory()}};</script><script src="/lib/client.js"></script>
<script type="module">
const cleanup=[];const ctx={effect(fn){cleanup.push(fn())},theme:{overrideTokens(source,tokens){for(const[key,v]of Object.entries(tokens))document.body.style.setProperty(key,v.dark);return()=>{for(const key of Object.keys(tokens))document.body.style.removeProperty(key)}}}};
const mount=()=>themePlugin.apply(ctx);mount();
document.querySelector('#replay').onclick=()=>{while(cleanup.length)cleanup.pop()();mount()};
document.querySelector('#new').onclick=()=>{document.querySelector('textarea').value='';document.querySelector('textarea').focus()};
document.querySelector('#sidebar').onclick=()=>document.querySelector('.fixture_frame').classList.toggle('collapsed');
const modal=document.querySelector('dialog');const openAbout=()=>{modal.removeAttribute('aria-hidden');modal.showModal()};document.querySelector('#about').onclick=openAbout;document.querySelector('.close').onclick=()=>modal.close();
let paused=false;document.querySelector('#motion').onclick=()=>{paused=!paused;const root=document.querySelector('.zero-one-wallpaper')?.shadowRoot;for(const el of [...(root?.querySelectorAll('*')||[]),...document.querySelectorAll('.zero-one-chassis *')])for(const a of el.getAnimations())paused?a.pause():a.play();document.querySelector('#motion').textContent=paused?'▶ 恢复动态':'Ⅱ 暂停动态'};
modal.addEventListener('close',()=>modal.setAttribute('aria-hidden','true'));document.querySelector('.send').onclick=openAbout;
</script></body></html>
